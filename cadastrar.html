
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar música</title>
    <link rel="stylesheet" href="cadastrar.css">
</head>
<body>

    <main>
        <a href="index.html" class="voltar">Voltar para a lista</a>

        <h1>Cadastrar música</h1>

        <section class="container">

            <label for="titulo">Título</label>
            <input type="text" id="titulo" placeholder="Digite o título da música">

            <label for="artista">Artista</label>
            <input type="text" id="artista" placeholder="Digite o nome do artista">

            <label for="genero">Gênero</label>
            <input type="text" id="genero" placeholder="Digite o gênero musical">

            <label for="ano">Ano</label>
            <input type="number" id="ano" placeholder="Digite o ano">

            <label for="duracao">Duração em minutos</label>
            <input type="number" id="duracao" placeholder="Ex: 5">

            <button id="botaoCadastrar">Cadastrar</button>

        </section>
    </main>

    <script src="cadastrar.js"></script>
</body>
</html>
